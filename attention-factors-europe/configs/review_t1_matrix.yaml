# Review follow-ups, tier 1 (decided 2026-11-26 by Henrik, after the external review of 2026-11-25; Thesis/part2/v13/
# REVIEW_FINDINGS.md). K = 30 only, US and Europe, the same code, data bundle (thesis_v3's afe_data.tar and SHA256SUMS)
# and rules as thesis_v3; every return reported after 5bp / 1bp (the objective's costs, as the thesis_v3 rows).
# DIAGNOSTIC rows: they never replace a headline value and select nothing. Asked after thesis_v3's out-of-sample
# rows, its 2022-2025 holdout included, had been seen. thesis_v3_matrix.yaml is not edited: it ran as it stands.
#
# (a) holdout   PCA + LongConv K = 30 on 2022-2025 with the PCA headline values (the winners of thesis_v3's
#               us_pcaq_K30 / eu_pcaq_K30, blocks v3_<m>_pca_K30), seeds 0-4, as thesis_v3's
#               <m>_attention_t4q_K30_2022_2025 do for attention (trained on the windows up to 2021, as every
#               year), and PCA + OU K = 30 on 2022-2025 with its headline thresholds (one run: deterministic).
#               Stage one has to end where the run ends (run_pca_longconv.Stage1), so two prep jobs build it to
#               2025 into pca_l252_2025 (configs/<m>_pca_stage1_2025.yaml); the 1998-2021 builds are not touched.
# (b) lambda    the joint attention model with the headline K = 30 values of each market (thesis_v3's
#               <m>_attention_t4q_K30: US sobol-076, lambda_Var 10.5; Europe eu_v2_headline, lambda_Var 0.842) and
#               objective.lambda_var replaced, seeds 0-4, 1998-2021. Grid: the decades 0.1, 1, 10, 100, 1000, the
#               same in both markets (Henrik, 2026-11-26), so the decade next to the headline value runs too (US 10
#               beside 10.5, Europe 1 beside 0.842) and the two markets share one axis. 100 is the paper's value. The loss is
#               -Sharpe - lambda_Var x explained variance, so a very large lambda_Var lets explained variance alone
#               steer the factors while the policy still trains on net Sharpe: it approaches the two-step model
#               (factors on explained variance first, then the policy), without being it (one joint run of epochs).
#               The sweep varies the joint model only; the two-step model has no lambda_Var.
# (c) books     the five-seed books of the 2022-2025 holdout (attention from thesis_v3, PCA + LongConv from (a))
#               need no training: scripts/holdout_books.py averages the saved weights after the runs
#               (docs/cloud_runs.md section 25).
#
# The headline values sit in blocks instead of `hyper:`, because run_matrix reads a `hyper` search from this
# matrix's own out dir only (as configs/table4_k30_rerun_matrix.yaml): each block is `matrix.hyper.values` of
# thesis_v3's resolved config runs/_matrix/thesis_v3/configs/<spec>.yaml, so a row resolves to that config but
# for its own keys. Out dir runs/_matrix/review_t1.
#   python scripts/run_matrix.py --matrix configs/review_t1_matrix.yaml --dry-run --jobs 46
#   python scripts/run_matrix.py --matrix configs/review_t1_matrix.yaml --smoke --jobs 8
#   bash scripts/spot_resume.sh install configs/review_t1_matrix.yaml --jobs 46 --threads 2
# How to run it: docs/cloud_runs.md section 25. Do not edit this file after the run has started.

name: review_t1

sets:
  seeds5: [0, 1, 2, 3, 4]
  seed0: [0]
  K30: [30]

blocks:
  holdout_pca_us:                # 2022-2025 on the stage one built to 2025
    sample.start: 2022-01-01
    sample.end: 2025-12-31
    factors.out_dir: data/us/shared/pca_l252_2025
  holdout_pca_europe17:
    sample.start: 2022-01-01
    sample.end: 2025-12-31
    factors.out_dir: data/europe17/holfill/pca_l252_2025
  v3_us_pca_K30:                 # thesis_v3 us_pca_longconv_perk_K30: us_pcaq_K30 winner sobol-136 (validation net SR 7.196)
    policy.residual_window: fixed
    policy.input: cumulative
    policy.input_scale: 157.0
    training.batch_days: 125
    policy.input_normalise: none
    policy.hidden: 64
    policy.dropout: 0.2
    training.epochs: 20
    policy.layers: 1
    training.lr: 0.000317
    training.weight_decay: 0.368
    policy.kernel_init: random
    policy.lambda_squash: 0.000463
  v3_eu_pca_K30:                 # thesis_v3 eu_pca_longconv_perk_K30: eu_pcaq_K30 winner sobol-061 (validation net SR 3.297)
    policy.residual_window: fixed
    policy.input: cumulative
    policy.input_scale: 1.09
    training.batch_days: 63
    policy.input_normalise: none
    policy.hidden: 64
    policy.dropout: 0.2
    training.epochs: 30
    policy.layers: 1
    training.lr: 0.00391
    training.weight_decay: 0.0173
    policy.kernel_init: geom_decay
    policy.lambda_squash: 0.000135
  v3_us_ou_K30:                  # thesis_v3 us_pca_ou_perk_K30: us_ouq_K30 winner grid-000 (validation net SR -1.482)
    policy.residual_window: fixed
    policy.c_thresh: 1.0
    policy.c_crit: 0.25
  v3_eu_ou_K30:                  # thesis_v3 eu_pca_ou_perk_K30: eu_ouq_K30 winner grid-001 (validation net SR -5.746)
    policy.residual_window: fixed
    policy.c_thresh: 1.0
    policy.c_crit: 0.5
  v3_us_K30:                     # thesis_v3 us_attention_t4q_K30: us_t4q_K30 winner sobol-076 (validation net SR 8.410)
    policy.residual_window: fixed
    policy.input: cumulative
    model.level_hidden: 0
    features.timing: asof
    features.include_cross_sectional_median: false
    features.include_risk_free: false
    policy.residual_lookback: 30
    objective.lambda_var: 10.5
    policy.input_scale: 39.4
    model.score_std_target: 0.837
    model.lambda_ridge: 2.02e-05
    training.batch_days: 125
    policy.input_normalise: window_vol
    policy.hidden: 64
    policy.dropout: 0.1
    model.embedding_dim: 32
    training.epochs: 10
    policy.layers: 1
    training.lr: 0.0085
    training.weight_decay: 0.0453
    policy.kernel_init: geom_decay
    policy.lambda_squash: 0.0068
  v3_eu_K30:                     # thesis_v3 eu_attention_t4q_K30: eu_t4q_K30 winner eu_v2_headline (validation net SR 6.512)
    policy.residual_window: fixed
    policy.input: cumulative
    model.level_hidden: 0
    features.timing: asof
    features.include_cross_sectional_median: false
    features.include_risk_free: false
    policy.residual_lookback: 30
    objective.lambda_var: 0.842
    policy.input_scale: 74.4
    model.score_std_target: null
    model.lambda_ridge: 0.00392
    training.batch_days: 125
    policy.input_normalise: window_vol
    policy.hidden: 32
    policy.dropout: 0.1
    model.embedding_dim: 32
    training.epochs: 30
    policy.layers: 1
    training.lr: 0.003
    training.weight_decay: 0.05
    policy.kernel_init: geom_decay
    policy.lambda_squash: 0.001

prep:                            # PCA stage one to 2025 on the shipped data; skipped when `done` exists
  pca_us_2025:
    script: scripts/build_pca_residuals.py
    config: configs/us_pca_stage1_2025.yaml
    done: data/us/shared/pca_l252_2025/meta.json
    mem_gb: 11
    cost: 70
  pca_europe17_2025:
    script: scripts/build_pca_residuals.py
    config: configs/europe_pca_stage1_2025.yaml
    done: data/europe17/holfill/pca_l252_2025/meta.json
    mem_gb: 5
    cost: 25

specs:
  # --- (a) holdout 2022-2025: PCA + LongConv (seeds 0-4) and PCA + OU (deterministic, one run) ----------
  - {name: us_pca_longconv_perk_K30_2022_2025, group: holdout, runner: pca, config: configs/us_pca_longconv.yaml, K: K30, seeds: seeds5, use: [holdout_pca_us, v3_us_pca_K30], after: pca_us_2025}
  - {name: eu_pca_longconv_perk_K30_2022_2025, group: holdout, runner: pca, config: configs/europe_pca_longconv.yaml, K: K30, seeds: seeds5, use: [holdout_pca_europe17, v3_eu_pca_K30], after: pca_europe17_2025}
  - {name: us_pca_ou_perk_K30_2022_2025, group: holdout, runner: pca, config: configs/us_pca_ou.yaml, K: K30, seeds: seed0, use: [holdout_pca_us, v3_us_ou_K30], after: pca_us_2025}
  - {name: eu_pca_ou_perk_K30_2022_2025, group: holdout, runner: pca, config: configs/europe_pca_ou.yaml, K: K30, seeds: seed0, use: [holdout_pca_europe17, v3_eu_ou_K30], after: pca_europe17_2025}

  # --- (b) lambda_Var sweep of the joint model, 1998-2021 ----------------------------------------------
  - {name: us_attention_t4q_K30_lv0p1, group: lambda_sweep, runner: attention, config: configs/us_headline_v2.yaml, K: K30, seeds: seeds5, use: [v3_us_K30], set: {objective.lambda_var: 0.1}}
  - {name: us_attention_t4q_K30_lv1, group: lambda_sweep, runner: attention, config: configs/us_headline_v2.yaml, K: K30, seeds: seeds5, use: [v3_us_K30], set: {objective.lambda_var: 1.0}}
  - {name: us_attention_t4q_K30_lv10, group: lambda_sweep, runner: attention, config: configs/us_headline_v2.yaml, K: K30, seeds: seeds5, use: [v3_us_K30], set: {objective.lambda_var: 10.0}}
  - {name: us_attention_t4q_K30_lv100, group: lambda_sweep, runner: attention, config: configs/us_headline_v2.yaml, K: K30, seeds: seeds5, use: [v3_us_K30], set: {objective.lambda_var: 100.0}}
  - {name: us_attention_t4q_K30_lv1000, group: lambda_sweep, runner: attention, config: configs/us_headline_v2.yaml, K: K30, seeds: seeds5, use: [v3_us_K30], set: {objective.lambda_var: 1000.0}}
  - {name: eu_attention_t4q_K30_lv0p1, group: lambda_sweep, runner: attention, config: configs/europe_headline_v2.yaml, K: K30, seeds: seeds5, use: [v3_eu_K30], set: {objective.lambda_var: 0.1}}
  - {name: eu_attention_t4q_K30_lv1, group: lambda_sweep, runner: attention, config: configs/europe_headline_v2.yaml, K: K30, seeds: seeds5, use: [v3_eu_K30], set: {objective.lambda_var: 1.0}}
  - {name: eu_attention_t4q_K30_lv10, group: lambda_sweep, runner: attention, config: configs/europe_headline_v2.yaml, K: K30, seeds: seeds5, use: [v3_eu_K30], set: {objective.lambda_var: 10.0}}
  - {name: eu_attention_t4q_K30_lv100, group: lambda_sweep, runner: attention, config: configs/europe_headline_v2.yaml, K: K30, seeds: seeds5, use: [v3_eu_K30], set: {objective.lambda_var: 100.0}}
  - {name: eu_attention_t4q_K30_lv1000, group: lambda_sweep, runner: attention, config: configs/europe_headline_v2.yaml, K: K30, seeds: seeds5, use: [v3_eu_K30], set: {objective.lambda_var: 1000.0}}
