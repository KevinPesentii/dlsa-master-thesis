# configs/us_search_pca.yaml on EUROPEAN data (decided 2026-10-12): the two-step benchmark
# (PCA + LongConv) trading with values validated on Europe's first window: fit 1993-1995 on
# the PCA residuals, score the net Sharpe on 1996-1997. Selected at K=30, used for every K.
# Same space, Sobol points, budget and rule as the US search; its winner (sobol-056) is carried
# into the finalists. Needs the stage one
# (scripts/build_pca_residuals.py --config configs/europe_pca_longconv.yaml).
#   python scripts/search_validation.py --config configs/europe_search_pca.yaml --stage select

runner: pca
base_config: configs/europe_pca_longconv.yaml   # everything not listed below comes from here
K: 30
first_oos_year: 1998          # fit 1993-1995 (sample.data_start) on the PCA residuals, score 1996-1997
validation_years: 2

# The LongConv knobs of configs/us_search.yaml's space (the attention-only ones dropped):
search:
  n_points: 64
  sobol_seed: 0
  seed: 0
  space:
    policy.input_scale: {log: [0.3, 300]}
    training.batch_days: {choice: [63, 125, 250]}
    policy.input: {choice: [cumulative, raw]}
    policy.input_normalise: {choice: [none, window_vol]}

finalists:
  top: 5
  seeds: [0, 1, 2]
  keep: [sobol-056]           # the US PCA search's winner
