# Europe hyperparameter search with the policy input divided by each window's own residual
# volatility (policy.input_normalise: window_vol), on the holiday-filled europe17 data whose
# returns.traded marks closed markets: lag 0, and a name keeps its position at a close where its
# market did not trade (one-day lag after its own holiday).
# Protocol of configs/europe_search.yaml: fit 1993-1995 (data_start), score the net Sharpe on
# 1996-1997, nothing after 1997 loaded. Commit before the search runs; do not edit afterwards.
# The data directory is an experiment copy built outside the repo (holiday fill + traded flag).
#   python scripts/search_validation.py --config configs/europe_search_windowvol.yaml --stage select

base_config: configs/europe_replication.yaml
K: 30
first_oos_year: 1998
validation_years: 2
eval_epochs: [10, 20, 30]

# Held fixed for every candidate (applied to the base config before the search).
fixed:
  data.dir: data/europe17/private/exp_holfill_traded
  policy.input_normalise: window_vol   # the assumption under test
  model.level_hidden: 0                # the paper's Equation (1): level-conditioned queries let the
                                       # Europe search of 2026-10-02 buy market beta (val beta 0.26-0.35)
  execution.lag: 0
  execution.stale_when_closed: true

# 6 knobs, 64 points: the budget of the first US search, as for the US. input_scale now multiplies a
# standardised window (cumulative sd up to ~sqrt(30)), hence 0.01-10 instead of 0.3-300.
search:
  n_points: 64
  sobol_seed: 0
  seed: 0
  space:
    objective.lambda_var: {log: [0.1, 300]}
    policy.input_scale: {log: [0.01, 10]}
    model.score_std_target: {log: [0.3, 3], "off": 0.25}
    model.lambda_ridge: {log: [1.0e-5, 1.0e-2]}
    training.batch_days: {choice: [63, 125, 250]}
    policy.input: {choice: [cumulative, raw]}

finalists:
  top: 5
  seeds: [0, 1, 2]

robustness:                            # not run (--stage select); kept so the file is complete
  seeds: [0, 1, 2]
  knobs:
    training.lr: [0.001, 0.01]
    policy.hidden: [16, 64]
