# configs/us_search_pca.yaml for model v2 (configs/thesis_v2_pca_matrix.yaml): the same window (fit 1990-1995,
# net Sharpe on 1996-1997), budget and rule, every candidate with the fixed residual window and cumulative
# input held. Three knobs, not four: the input is cumulative as given. Written 2026-11-06, before this search
# ran. Commit it first and do not edit it afterwards.
# With the book traded one close later (execution.lag 1 in the validation scoring; the policy trains on its targets).
#   python scripts/search_validation.py --config configs/us_search_pca_v2_lag1.yaml --stage select

runner: pca
base_config: configs/us_pca_longconv.yaml   # everything not listed below comes from here
K: 30
first_oos_year: 1998          # fit 1990-1995 on the PCA residuals, score the net Sharpe on 1996-1997
validation_years: 2

search:
  n_points: 64                # the budget of configs/us_search_pca.yaml
  sobol_seed: 0
  seed: 0
  space:
    policy.input_scale: {log: [0.3, 300]}
    training.batch_days: {choice: [63, 125, 250]}
    policy.input_normalise: {choice: [none, window_vol]}

fixed:                        # held for every candidate
  policy.residual_window: fixed
  policy.input: cumulative
  execution.lag: 1

finalists:
  top: 5
  seeds: [0, 1, 2]
