# configs/europe_search_v2.yaml with every candidate trading one close later (execution.lag 1): the values
# of the Europe lag-1 row of configs/thesis_v2_matrix.yaml, which carries the US lag-1 winner into the
# finalists (`keep_from: us_v2_lag1`). Written 2026-11-06, before this search ran.
#   python scripts/search_validation.py --config configs/europe_search_v2_lag1.yaml --stage select

base_config: configs/europe_replication.yaml   # everything not listed below comes from here
K: 30
first_oos_year: 1998          # first training window = [sample.data_start, first_oos_year): 1993-1997
validation_years: 2           # its last two years
eval_epochs: [10, 20, 30, 45] # extra points on each learning curve; the final epoch is always scored

# Stage 1. Sobol points over what the paper leaves open, or where our units differ from the
# paper's. log: log-uniform on [lo, hi]; "off": probability of null (switched off); choice: one of.
# Keep "off" quoted: bare off is the boolean false in YAML 1.1 (PyYAML), which silently
# dropped it in the first run (20260926T091942Z, superseded).
search:
  n_points: 128               # the budget of configs/us_search.yaml
  sobol_seed: 0
  seed: 0
  space:
    objective.lambda_var: {log: [0.1, 300]}            # paper 100, but its loss units are not ours
    policy.input_scale: {log: [0.3, 300]}              # not in the paper: decimal (1) to percent (100)
    model.score_std_target: {log: [0.3, 3], "off": 0.25}  # not in the paper: score temperature
    model.lambda_ridge: {log: [1.0e-5, 1.0e-2]}        # paper: "a ridge penalty for stability", no value
    training.batch_days: {choice: [63, 125, 250]}      # paper: not stated
    policy.input_normalise: {choice: [none, window_vol]}  # not in the paper: scale-free policy input

fixed:                        # held for every candidate (a key of the base config)
  data.dir: data/europe17/holfill   # the headline European data (stage 2b); never carried into a run
  policy.residual_window: fixed
  policy.input: cumulative
  model.level_hidden: 0
  features.timing: asof
  features.include_cross_sectional_median: false
  features.include_risk_free: false
  data.returns_history: true    # (data keys are never carried into a run; the run's config has it)
  execution.lag: 1

# Stage 2. The best `top` points of stage 1, the base config and `keep` are rerun with these
# seeds; the winner is the best MEAN validation net Sharpe. selected.yaml = base config + its values.
finalists:
  top: 5
  seeds: [0, 1, 2]
  # keep: the US search's winner, passed by scripts/run_matrix.py (`keep_from` in the matrix)

# Stage 3. Table 4 values of the paper, moved one at a time on the winner: about a third and
# three times the paper's value (sizes and counts: half and double). REPORTED, NOT ADOPTED:
# Table 4 is the paper's own selection under this protocol, and 16 comparisons on three
# seeds would adopt noise.
robustness:
  seeds: [0, 1, 2]
  knobs:
    training.lr: [0.001, 0.01]                # 0.003
    training.weight_decay: [0.015, 0.15]      # 0.05
    training.epochs: [15, 60]                 # 30
    policy.dropout: [0.0, 0.3]                # 0.1
    policy.hidden: [16, 64]                   # 32
    policy.lambda_squash: [0.0003, 0.003]     # 0.001
    policy.residual_lookback: [15, 60]        # 30
    model.embedding_dim: [16, 64]             # 32
