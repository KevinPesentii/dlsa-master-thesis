# The missing cells of the mechanism table at K = 30 (decided 2026-11-23, Henrik). thesis_v3 has the gross
# objective with joint training only and two-step attention with the net objective only; this matrix adds, for
# both markets:
#   two-step attention, gross objective   factors on explained variance, then the policy on frozen residuals,
#                                         trained without costs (training.two_step + objective costs 0)
#   PCA + LongConv, gross objective       the benchmark's policy trained without costs on the PCA residuals
# so the table is {joint attention, two-step attention, PCA} x {net objective, gross objective}. Asked AFTER the
# out-of-sample rows of thesis_v3 (its mechanism rows included) had been seen.
# DIAGNOSTIC rows, never a headline value. thesis_v3_matrix.yaml is not edited: it ran as it stands.
#
# Same code, data, seeds (0-4), windows and rules as thesis_v3 (commit 1123394, the audited data, halts closed): each row
# has its own search on 1996-97 (the 2026-10-10 rule), with the costs held at 0 so that the search scores gross Sharpe;
# the rows report net after 5bp / 1bp (evaluation.turnover_cost / short_cost), as the v3 gross rows do. The
# searches are the v3 searches' configs with more keys held (`fixed`), so a point named sobol-i is the same
# point as in thesis_v3, and Europe carries its US winner.
#   two-step: the costs enter the second step only (the policy); the first is on explained variance and ignores them.
#
#   python scripts/run_matrix.py --matrix configs/thesis_v3_gross_matrix.yaml --dry-run --jobs 23
#   python scripts/run_matrix.py --matrix configs/thesis_v3_gross_matrix.yaml --smoke --jobs 8
#   bash scripts/spot_resume.sh install configs/thesis_v3_gross_matrix.yaml --jobs 23 --threads 2
# How to run it: docs/cloud_runs.md section 24. Do not edit this file after the run has started.

name: thesis_v3_gross

sets:
  seeds5: [0, 1, 2, 3, 4]
  K30: [30]

prep:                            # PCA stage one on the shipped data; skipped when `done` exists
  pca_us:
    script: scripts/build_pca_residuals.py
    config: configs/us_pca_longconv.yaml
    done: data/us/shared/pca_l252/meta.json
    mem_gb: 10
    cost: 60
  pca_europe17:
    script: scripts/build_pca_residuals.py
    config: configs/europe_pca_longconv.yaml
    done: data/europe17/holfill/pca_l252/meta.json
    mem_gb: 4
    cost: 20

# The two US searches (two-step 15 + PCA 8 = 23 workers) start together; Europe's wait for the US winner of
# the same kind.
searches:
  us_t4q_twostep_gross_K30: {config: configs/us_search_t4_quick.yaml, K: 30, workers: 15, mem_gb_per_worker: 3,
                             fixed: {training.two_step: true, objective.turnover_cost: 0.0, objective.short_cost: 0.0}}
  eu_t4q_twostep_gross_K30: {config: configs/europe_search_t4_quick.yaml, K: 30, workers: 12, mem_gb_per_worker: 3,
                             keep_from: us_t4q_twostep_gross_K30,
                             fixed: {training.two_step: true, objective.turnover_cost: 0.0, objective.short_cost: 0.0}}
  us_pcaq_gross_K30: {config: configs/us_search_pca_perk.yaml, K: 30, workers: 8, mem_gb_per_worker: 3, after: pca_us,
                      fixed: {objective.turnover_cost: 0.0, objective.short_cost: 0.0}}
  eu_pcaq_gross_K30: {config: configs/europe_search_pca_perk.yaml, K: 30, workers: 8, mem_gb_per_worker: 2, after: pca_europe17,
                      keep_from: us_pcaq_gross_K30,
                      fixed: {objective.turnover_cost: 0.0, objective.short_cost: 0.0}}

blocks: {}

specs:
  - {name: us_attention_K30_two_step_gross_trained, group: mechanism, runner: attention, config: configs/us_headline_v2.yaml, K: K30, seeds: seeds5, hyper: us_t4q_twostep_gross_K30, set: {evaluation.turnover_cost: 0.0005, evaluation.short_cost: 0.0001}}
  - {name: eu_attention_K30_two_step_gross_trained, group: mechanism, runner: attention, config: configs/europe_headline_v2.yaml, K: K30, seeds: seeds5, hyper: eu_t4q_twostep_gross_K30, set: {evaluation.turnover_cost: 0.0005, evaluation.short_cost: 0.0001}}
  - {name: us_pca_longconv_K30_gross_trained, group: mechanism, runner: pca, config: configs/us_pca_longconv.yaml, K: K30, seeds: seeds5, hyper: us_pcaq_gross_K30, after: pca_us, set: {evaluation.turnover_cost: 0.0005, evaluation.short_cost: 0.0001}}
  - {name: eu_pca_longconv_K30_gross_trained, group: mechanism, runner: pca, config: configs/europe_pca_longconv.yaml, K: K30, seeds: seeds5, hyper: eu_pcaq_gross_K30, after: pca_europe17, set: {evaluation.turnover_cost: 0.0005, evaluation.short_cost: 0.0001}}
