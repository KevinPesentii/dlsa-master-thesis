# Review follow-ups, tier 2 (decided 2026-11-26 by Henrik, after the external review of 2026-11-25; Thesis/part2/v13/
# REVIEW_FINDINGS.md). K = 30, US and Europe, seeds 0-4, 1998-2021, the same code, data bundle (thesis_v3's
# afe_data.tar and SHA256SUMS) and rules as thesis_v3; every return reported after 5bp / 1bp. Two rows per market:
#   rf     the headline K = 30 attention model (thesis_v3's <m>_attention_t4q_K30, block v3_<m>_K30) trained with
#          the risk-free rate subtracted in the objective, (Rbar_net - R_f) / sd, objective.subtract_rf: true: the
#          paper's objective, which every run before 2026-11-17 used. Nothing else changes; the tables report
#          mean(net) / sd(net) as for every row.
#   paper  the K = 30 attention model with the paper's values: the `base` candidate that every quick search carried
#          as a finalist (configs/us_search_t4_quick.yaml / europe_search_t4_quick.yaml: the replication config,
#          i.e. the paper's Table 4, with model v2's fixed keys), block v3_<m>_K30_base, exactly the values
#          run_matrix would take for `base` from thesis_v3's us_t4q_K30 / eu_t4q_K30 (selected_values). In those
#          searches base had validation net SR 5.82 (US) and 3.69 (Europe) on seeds 0-2.
# DIAGNOSTIC rows: they never replace a headline value and select nothing. Asked after thesis_v3's out-of-sample rows
# had been seen. Values in blocks instead of `hyper:` (run_matrix reads `hyper` from this matrix's own out dir only),
# each taken from thesis_v3's run files. Out dir runs/_matrix/review_t2.
#   python scripts/run_matrix.py --matrix configs/review_t2_matrix.yaml --dry-run --jobs 20
#   python scripts/run_matrix.py --matrix configs/review_t2_matrix.yaml --smoke --jobs 4
#   bash scripts/spot_resume.sh install configs/review_t2_matrix.yaml --jobs 20 --threads 2
# How to run it: docs/cloud_runs.md section 25. Do not edit this file after the run has started.

name: review_t2

sets:
  seeds5: [0, 1, 2, 3, 4]
  K30: [30]

blocks:
  v3_us_K30:                     # thesis_v3 us_attention_t4q_K30: us_t4q_K30 winner sobol-076 (validation net SR 8.410)
    policy.residual_window: fixed
    policy.input: cumulative
    model.level_hidden: 0
    features.timing: asof
    features.include_cross_sectional_median: false
    features.include_risk_free: false
    policy.residual_lookback: 30
    objective.lambda_var: 10.5
    policy.input_scale: 39.4
    model.score_std_target: 0.837
    model.lambda_ridge: 2.02e-05
    training.batch_days: 125
    policy.input_normalise: window_vol
    policy.hidden: 64
    policy.dropout: 0.1
    model.embedding_dim: 32
    training.epochs: 10
    policy.layers: 1
    training.lr: 0.0085
    training.weight_decay: 0.0453
    policy.kernel_init: geom_decay
    policy.lambda_squash: 0.0068
  v3_eu_K30:                     # thesis_v3 eu_attention_t4q_K30: eu_t4q_K30 winner eu_v2_headline (validation net SR 6.512)
    policy.residual_window: fixed
    policy.input: cumulative
    model.level_hidden: 0
    features.timing: asof
    features.include_cross_sectional_median: false
    features.include_risk_free: false
    policy.residual_lookback: 30
    objective.lambda_var: 0.842
    policy.input_scale: 74.4
    model.score_std_target: null
    model.lambda_ridge: 0.00392
    training.batch_days: 125
    policy.input_normalise: window_vol
    policy.hidden: 32
    policy.dropout: 0.1
    model.embedding_dim: 32
    training.epochs: 30
    policy.layers: 1
    training.lr: 0.003
    training.weight_decay: 0.05
    policy.kernel_init: geom_decay
    policy.lambda_squash: 0.001
  v3_us_K30_base:                # thesis_v3 us_t4q_K30 candidate base (the paper's values + model v2's fixed keys)
    policy.residual_window: fixed
    policy.input: cumulative
    model.level_hidden: 0
    features.timing: asof
    features.include_cross_sectional_median: false
    features.include_risk_free: false
    policy.residual_lookback: 30
    objective.lambda_var: 100
    policy.input_scale: 1.0
    model.score_std_target: 1.0
    model.lambda_ridge: 0.0001
    training.batch_days: 125
    policy.input_normalise: none
    policy.hidden: 32
    policy.dropout: 0.1
    model.embedding_dim: 32
    training.epochs: 30
    policy.layers: 1
    training.lr: 0.003
    training.weight_decay: 0.05
    policy.kernel_init: geom_decay
    policy.lambda_squash: 0.001
  v3_eu_K30_base:                # thesis_v3 eu_t4q_K30 candidate base (the paper's values + model v2's fixed keys)
    policy.residual_window: fixed
    policy.input: cumulative
    model.level_hidden: 0
    features.timing: asof
    features.include_cross_sectional_median: false
    features.include_risk_free: false
    policy.residual_lookback: 30
    objective.lambda_var: 100
    policy.input_scale: 1.0
    model.score_std_target: 1.0
    model.lambda_ridge: 0.0001
    training.batch_days: 125
    policy.input_normalise: none
    policy.hidden: 32
    policy.dropout: 0.1
    model.embedding_dim: 32
    training.epochs: 30
    policy.layers: 1
    training.lr: 0.003
    training.weight_decay: 0.05
    policy.kernel_init: geom_decay
    policy.lambda_squash: 0.001

prep: {}

specs:
  - {name: us_attention_t4q_K30_rf, group: objective, runner: attention, config: configs/us_headline_v2.yaml, K: K30, seeds: seeds5, use: [v3_us_K30], set: {objective.subtract_rf: true}}
  - {name: eu_attention_t4q_K30_rf, group: objective, runner: attention, config: configs/europe_headline_v2.yaml, K: K30, seeds: seeds5, use: [v3_eu_K30], set: {objective.subtract_rf: true}}
  - {name: us_attention_K30_paper, group: paper_values, runner: attention, config: configs/us_headline_v2.yaml, K: K30, seeds: seeds5, use: [v3_us_K30_base]}
  - {name: eu_attention_K30_paper, group: paper_values, runner: attention, config: configs/europe_headline_v2.yaml, K: K30, seeds: seeds5, use: [v3_eu_K30_base]}
