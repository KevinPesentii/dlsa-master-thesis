# configs/us_search_pca_v2.yaml on European data: fit 1993-1995 (sample.data_start), net Sharpe on 1996-1997, the
# Europe protocol of 2026-10-12. Same space, Sobol points, budget and rule; the matrix carries the US winner
# into the finalists (`keep_from`). Written 2026-11-06, before this search ran. Commit it first and do not edit it.
#   python scripts/search_validation.py --config configs/europe_search_pca_v2.yaml --stage select

runner: pca
base_config: configs/europe_pca_longconv.yaml   # everything not listed below comes from here
K: 30
first_oos_year: 1998          # fit 1993-1995 (sample.data_start) on the PCA residuals, score the net Sharpe on 1996-1997
validation_years: 2

search:
  n_points: 64                # the budget of configs/us_search_pca.yaml
  sobol_seed: 0
  seed: 0
  space:
    policy.input_scale: {log: [0.3, 300]}
    training.batch_days: {choice: [63, 125, 250]}
    policy.input_normalise: {choice: [none, window_vol]}

fixed:                        # held for every candidate
  policy.residual_window: fixed
  policy.input: cumulative

finalists:
  top: 5
  seeds: [0, 1, 2]
