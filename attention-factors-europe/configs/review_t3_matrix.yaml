# Review follow-ups, tier 3 (decided 2026-11-26 by Henrik, after the external review of 2026-11-25; Thesis/part2/v13/
# REVIEW_FINDINGS.md). The US top 200 gets its own search at K = 30. Until now us_top200_t4q_K30 (thesis_v3) trades with
# the US-500 K = 30 values, while Europe's 200 names have their own search; this removes the asymmetry.
#   search  us200_t4q_K30: the US quick search unchanged (configs/us_search_t4_quick.yaml: fit 1990-1995, net Sharpe on
#           1996-1997, same space, the same 256 points of the same Sobol draw, so sobol-i is the same candidate as in
#           thesis_v3), with sample.universe_size 200 held for every candidate (`fixed`). Finalists on seeds 0-2: the
#           best 10, the paper's values (base), the named us_v2_headline of the config, and the US-500 K = 30 winner
#           (sobol-076, carried by keep_from from thesis_v3's finished us_t4q_K30, which travels with the bundle);
#           winner = best mean validation net Sharpe. search_validation.py validates on the members up to cap rank 200
#           when a search holds sample.universe_size in `fixed` (added 2026-11-26 for this search; no earlier search
#           holds it, so none changes).
#   row     us_top200_own_t4q_K30: the winner on seeds 0-4, 1998-2021, the universe definition of us_top200_t4q_K30
#           (configs/us_headline_v2.yaml with sample.universe_size 200: the 200 largest of the US-500 build by
#           prior-month cap). A `fixed` sample key is not carried to rows (run_matrix.selected_values), so the row
#           sets it itself, as us_top200_t4q_K30 does.
# Same code, data bundle (thesis_v3's afe_data.tar and SHA256SUMS) and rules as thesis_v3; returns after 5bp / 1bp.
# DIAGNOSTIC row: it never replaces a headline value. Asked after thesis_v3's out-of-sample rows, us_top200_t4q_K30
# included, had been seen. Out dir runs/_matrix/review_t3.
#   python scripts/run_matrix.py --matrix configs/review_t3_matrix.yaml --dry-run --jobs 16
#   python scripts/run_matrix.py --matrix configs/review_t3_matrix.yaml --smoke --jobs 4
#   bash scripts/spot_resume.sh install configs/review_t3_matrix.yaml --jobs 16 --threads 2
# How to run it: docs/cloud_runs.md section 25. Do not edit this file after the run has started.

name: review_t3

sets:
  seeds5: [0, 1, 2, 3, 4]
  K30: [30]

blocks: {}

prep: {}

searches:
  us200_t4q_K30: {config: configs/us_search_t4_quick.yaml, K: 30, workers: 16, mem_gb_per_worker: 3,
                  keep_from: thesis_v3/us_t4q_K30, fixed: {sample.universe_size: 200}}

specs:
  - {name: us_top200_own_t4q_K30, group: robustness, runner: attention, config: configs/us_headline_v2.yaml, K: K30, seeds: seeds5, hyper: us200_t4q_K30, set: {sample.universe_size: 200}}
