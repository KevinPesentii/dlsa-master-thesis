  eu_t4q_K30:  {config: configs/europe_search_t4_quick.yaml, K: 30, workers: 6, mem_gb_per_worker: 3, keep_from: us_t4q_K30}
  eu_t4q_gross_K30:   {config: configs/europe_search_t4_quick.yaml, K: 30, workers: 6, mem_gb_per_worker: 3,
