  eu_pcaq_K8:   {config: configs/europe_search_pca_perk.yaml, K: 8, workers: 4, mem_gb_per_worker: 2, after: pca_europe17, keep_from: us_pcaq_K8}
  eu_pcaq_K5:   {config: configs/europe_search_pca_perk.yaml, K: 5, workers: 4, mem_gb_per_worker: 2, after: pca_europe17, keep_from: us_pcaq_K5}
  eu_pcaq_K3:   {config: configs/europe_search_pca_perk.yaml, K: 3, workers: 4, mem_gb_per_worker: 2, after: pca_europe17, keep_from: us_pcaq_K3}
  eu_pcaq_K1:   {config: configs/europe_search_pca_perk.yaml, K: 1, workers: 4, mem_gb_per_worker: 2, after: pca_europe17, keep_from: us_pcaq_K1}
  us_ouq_K100: {config: configs/us_search_ou_v2.yaml, K: 100, workers: 1, mem_gb_per_worker: 3, after: pca_us}
  us_ouq_K30:  {config: configs/us_search_ou_v2.yaml, K: 30, workers: 1, mem_gb_per_worker: 3, after: pca_us}
  us_ouq_K15:  {config: configs/us_search_ou_v2.yaml, K: 15, workers: 1, mem_gb_per_worker: 3, after: pca_us}
