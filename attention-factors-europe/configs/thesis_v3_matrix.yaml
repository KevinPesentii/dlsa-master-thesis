  us_t4q_K100: {config: configs/us_search_t4_quick.yaml, K: 100, workers: 16, mem_gb_per_worker: 3}
  us_t4q_K15:  {config: configs/us_search_t4_quick.yaml, K: 15, workers: 10, mem_gb_per_worker: 3}
