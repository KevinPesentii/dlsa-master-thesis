  eu_t4q_lag1_K30:    {config: configs/europe_search_t4_quick.yaml, K: 30, workers: 6, mem_gb_per_worker: 3,
                       keep_from: us_t4q_lag1_K30, fixed: {execution.lag: 1}}
  eu_t4q_K100: {config: configs/europe_search_t4_quick.yaml, K: 100, workers: 8, mem_gb_per_worker: 3, keep_from: us_t4q_K100}
  eu_t4q_K15:  {config: configs/europe_search_t4_quick.yaml, K: 15, workers: 6, mem_gb_per_worker: 3, keep_from: us_t4q_K15}
  eu_t4q_K8:   {config: configs/europe_search_t4_quick.yaml, K: 8, workers: 6, mem_gb_per_worker: 3, keep_from: us_t4q_K8}
  eu_t4q_K5:   {config: configs/europe_search_t4_quick.yaml, K: 5, workers: 6, mem_gb_per_worker: 3, keep_from: us_t4q_K5}
  eu_t4q_K3:   {config: configs/europe_search_t4_quick.yaml, K: 3, workers: 6, mem_gb_per_worker: 3, keep_from: us_t4q_K3}
  eu_t4q_K1:   {config: configs/europe_search_t4_quick.yaml, K: 1, workers: 6, mem_gb_per_worker: 3, keep_from: us_t4q_K1}
  us_pcaq_K100: {config: configs/us_search_pca_perk.yaml, K: 100, workers: 8, mem_gb_per_worker: 3, after: pca_us}
  us_pcaq_K30:  {config: configs/us_search_pca_perk.yaml, K: 30, workers: 8, mem_gb_per_worker: 3, after: pca_us}
  us_pcaq_K15:  {config: configs/us_search_pca_perk.yaml, K: 15, workers: 8, mem_gb_per_worker: 3, after: pca_us}
  us_pcaq_K8:   {config: configs/us_search_pca_perk.yaml, K: 8, workers: 8, mem_gb_per_worker: 3, after: pca_us}
  us_pcaq_K5:   {config: configs/us_search_pca_perk.yaml, K: 5, workers: 8, mem_gb_per_worker: 3, after: pca_us}
  us_pcaq_K3:   {config: configs/us_search_pca_perk.yaml, K: 3, workers: 8, mem_gb_per_worker: 3, after: pca_us}
