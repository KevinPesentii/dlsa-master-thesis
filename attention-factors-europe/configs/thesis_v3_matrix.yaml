# K = 30 ensemble validation (scripts/ensemble_validation.py): the top three finalists of the K = 30 search,
# each on seeds 0-4, fitted 1990-95 (Europe 1993-95) and booked on 1996-97 like a search trial (seeds 0-2
# reproduce the search's own trials). Books rescaled to ||w||_1 = 1 daily (avg_l1). The decision reads
# `seeds` (the winner's five seeds, 5 models) against `all` (top three x five seeds, 15 models); the
# configs-only books (three finalists on one seed) and every single model are in books.csv too.
ensembles:
  us_ens_K30: {search: us_t4q_K30, top: 3, seeds: [0, 1, 2, 3, 4], book: avg_l1, compare: [seeds, all], workers: 15, mem_gb_per_worker: 3}
  eu_ens_K30: {search: eu_t4q_K30, top: 3, seeds: [0, 1, 2, 3, 4], book: avg_l1, compare: [seeds, all], workers: 15, mem_gb_per_worker: 3}

