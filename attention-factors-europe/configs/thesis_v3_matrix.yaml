# The full thesis rerun (decided 2026-11-17, Henrik): every reported row again, after two changes that
# touch every number, and before any of these runs existed:
#   1. the objective without R_f (objective.subtract_rf: false in every base config, commit 87fe9bf);
#   2. the audited input data (data/input-audit-fixes, Thesis/diagnostics/2026-11-17_input_data_audit).
# Same rules as the per-K headline (search_t4q / search_t4q_eu / pca_perk): each K trades with the
# winner of its own search, fitted 1990-95 (Europe 1993-95) and scored on net Sharpe 1996-97, seeds 0-4
# out of sample 1998-2021. Spec names are those of the earlier matrices, so the analysis scripts only
# need the new out dir runs/_matrix/thesis_v3. Every attention row saves weights, yearly models and the
# factor diagnostics; every PCA row its weights (scripts/check_matrix_outputs.py checks).
#
# Groups:
#   headline   attention, every K, both markets (us_t4q_K<K> / eu_t4q_K<K>, Europe carries the US winner)
#   benchmark  PCA + LongConv (own per-K searches) and PCA + OU (3 x 3 grid per K), fixed residual window
#   ensemble   K = 30: the search's #2 and #3 finalists out of sample (seeds 0-4) next to the winner (#1 =
#              the headline row), and `ensembles:` below scores on the validation window whether one book
#              of the winner's five seeds or of the top three finalists x five seeds earns more. Decided
#              before any of it ran: that comparison picks the ensemble the thesis reports; every book is
#              reported anyway (the books themselves are built afterwards from the saved weights).
#   ablation   K = 30, the six characteristic themes dropped one at a time, both markets
#   robustness K = 30, US top 200
#   holdout    K = 30, 2022-2025, both markets (trained on the windows up to 2021, as every year)
#   mechanism  K = 30, three rows that change how the model trains or trades, each with its own search
#              (the 2026-10-10 rule), both markets:
#                gross:   no costs in the objective, and its search scores gross Sharpe (the pipeline never
#                         sees costs); its rows report net after 5bp / 1bp (evaluation.*_cost)
#                twostep: factors on explained variance first, then the policy on frozen residuals
#                         (training.two_step)
#                lag1:    traded one close later (execution.lag 1), in training and out of sample
#
#   python scripts/run_matrix.py --matrix configs/thesis_v3_matrix.yaml --dry-run --jobs 46
#   python scripts/run_matrix.py --matrix configs/thesis_v3_matrix.yaml --smoke --jobs 8
#   bash scripts/spot_resume.sh install configs/thesis_v3_matrix.yaml --jobs 46 --threads 2
# Guide for the machine: docs/rerun_thesis_v3.md. Do not edit this file after the run has started.

name: thesis_v3

sets:
  seeds5: [0, 1, 2, 3, 4]
  seed0: [0]
  K1: [1]
  K3: [3]
  K5: [5]
  K8: [8]
  K15: [15]
  K30: [30]
  K100: [100]

blocks:
  holdout:
    sample.start: 2022-01-01
    sample.end: 2025-12-31

prep:                            # PCA stage one on the shipped data; skipped when `done` exists
  pca_us:
    script: scripts/build_pca_residuals.py
    config: configs/us_pca_longconv.yaml
    done: data/us/shared/pca_l252/meta.json
    mem_gb: 10
    cost: 60
  pca_europe17:
    script: scripts/build_pca_residuals.py
    config: configs/europe_pca_longconv.yaml
    done: data/europe17/holfill/pca_l252/meta.json
    mem_gb: 4
    cost: 20

# Searches start in this order when slots allow: US K = 30 first (the ensemble, ablation, robustness and
# holdout rows and the Europe K = 30 search wait for it), then the K = 30 mechanism searches, the rest.
