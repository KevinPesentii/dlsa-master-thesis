# European build "europe17": the 200 largest companies pooled across ALL 17 exchange
# countries of configs/europe_extract.yaml (London .. Athens), universe months 1990-01 to
# 2025-12, every value in one numeraire: the ECU to 1998-12-31, the euro from 1999-01-01
# (src/afe/data/europe_fx.py). Same eligibility rules as the euro-11 step 1
# (docs/eu_mktcap_compustat_global.md): header link + turnover screen, common shares,
# cross-listings collapsed, one line per company.
#   python scripts/fetch_europe_extract.py                                       # WRDS, once, shared
#   python scripts/build_europe_universe.py --config configs/europe17_data.yaml  # cap table, ranking, lines
#   python scripts/fetch_europe_raw.py --configs configs/europe17_data.yaml configs/europe12_data.yaml
#   python scripts/build_europe_dataset.py --config configs/europe17_data.yaml   # returns, universe, features
# The sibling configs/europe12_data.yaml differs only in `countries`, `market` and `output`.

market: europe17

countries: [GBR, DEU, FRA, CHE, NLD, ITA, ESP, SWE, BEL, DNK, FIN, NOR, IRL, PRT, AUT, LUX, GRC]

extract:
  dir: data/europe/private           # step-1 pull, shared by both versions

filters:                             # as configs/universe_eu_compustat.yaml, plus:
  issue_types: ["0", "8"]            # common shares and participation certificates (Swiss PS, French CI)
  genussschein_countries: [CHE]      # tpci 'Q' counts on these exchanges only (Roche; German ones are debt)
  min_turnover: 3.0e-5
  turnover_window: 6
  min_class_share: 0.05              # a share class below 5% of the cap never prices the company (compustat_global)
  dup_tol: 0.02                      # a class within 2% of another in shares AND price is that class again
  fx_max_stale_days: 7

corrections:
  # g_secd share counts in another unit than the price, found by scripts/check_caps.py
  # (dividend yield of the price feed vs the accounts). cshoc / divide_by on start..end, in
  # the cap table AND the daily rows of stage 2 (turnover).
  share_count:
    - {gvkey: "208226", iid: "01W", start: 1984-01-01, end: 2005-04-26, divide_by: 10,
       note: "Eurocommercial Properties: price per depositary receipt (10 shares), cshoc in shares until 2005-04-27"}
    - {gvkey: "200363", iid: "02W", start: 2024-11-12, end: 2024-12-05, divide_by: 566.9,
       note: "Atos: the 63.2bn shares of the restructuring counted from 2024-11-12, the old share's price until 2024-12-05 (111.4m before)"}
    - {gvkey: "102217", iid: "01W", start: 2020-04-30, end: 2020-05-01, divide_by: 50,
       note: "Vetropack: the 1:50 split's share count two trading days before its price"}
    - {gvkey: "200795", iid: "01W", start: 1984-01-01, end: 1990-05-08, divide_by: 10,
       note: "Bonheur: 76.6m shares before 1990-05-09 against 11.5m after a 3:2 split at a flat adjusted price"}
  # lines that carry another line's shares, on the dates given (the general rules of
  # compustat_global miss them: different share count or a stale price)
  exclude_lines:
    - {gvkey: "010846", iid: "01W", start: 1984-01-01, end: 2019-06-30,
       note: "Unilever NV ordinary shares: the CVA line 02W certifies the same shares and trades"}
    - {gvkey: "010846", iid: "02W", start: 2019-07-01, end: 2019-07-31,
       note: "Unilever NV CVA: last row after the certificates were cancelled; 01W carries NV from July 2019"}
    - {gvkey: "010846", iid: "01W", start: 2020-11-01, end: 2020-11-30,
       note: "Unilever NV: last row in the month of the unification, when the PLC's Amsterdam line 23W trades"}
    - {gvkey: "010846", iid: "11W", start: 1984-01-01, end: 2020-10-31,
       note: "Unilever NV CVA quoted in London: a cross-listing of 02W whose share count ran ahead of its price (2004-06)"}
    - {gvkey: "015589", iid: "02W", start: 1984-01-01, end: 1998-04-30,
       note: "Paribas FRF100 line: 01W's price to the centime, no volume, a frozen share count (131m, then 160m) next to 01W's 65-124m"}
    - {gvkey: "101895", iid: "14W", start: 1984-01-01, end: 2099-12-31,
       note: "Lindt participation certificate quoted with the registered shares' count (135,099): collapsed into, or added to, the wrong class"}
    - {gvkey: "102696", iid: "09W", start: 1984-01-01, end: 2099-12-31,
       note: "Logitech second SIX line: the registered share at its own (2023) or a different (2025) share count"}
    - {gvkey: "144496", iid: "01W", start: 2014-12-01, end: 2099-12-31,
       note: "UBS AG after the exchange into UBS Group AG (09W, 2014-11-28): the same company's shares twice"}
    - {gvkey: "144496", iid: "20W", start: 1984-01-01, end: 2099-12-31,
       note: "UBS Group second CHF line of 2025-05 (3.46bn shares, 09W's price)"}
    - {gvkey: "273099", iid: "10W", start: 1984-01-01, end: 2099-12-31,
       note: "MTU young shares line of 2023-05 carrying the total share count"}
  # one gvkey holding both halves of a dual-listed company: the cap sums the home classes of
  # all the countries (the pricing line is still the most active class)
  dual_listed:
    - {gvkey: "010846", countries: [NLD, GBR], start: 1984-01-01, end: 2020-10-31,
       note: "Unilever NV (Amsterdam) + Unilever PLC (London), one company until the 2020-11-29 unification"}

currency:
  numeraire: XEU                     # ECU to 1998-12-31, EUR from 1999-01-01, 1:1 at the switch
  # official daily ECU rates (Eurostat ert_bil_eur_d, GBP and USD per ECU, 1984-1998): a CHECK of
  # the basket in the reports, not a source (curl the dissemination API; docs/europe_build.md)
  official_ecu_check: data/europe/private/raw/external/eurostat_ert_bil_eur_d_gbp_usd_1984_1998.csv

universe:
  size: 200
  start: 1990-01                     # first universe month, ranked on the cap at the end of 1989-12
  end: 2025-12
  ranking_start: 1985-12             # first as-of ranking: the market of the pre-sample years

raw:
  dir: data/europe/private/raw       # union of both versions' lines (fetch_europe_raw.py)
  daily_start_year: 1984             # Compustat Global daily rows begin 1984-01
  daily_end_year: 2025
  funda_start_year: 1984
  jkp_start_year: 1985
  fx_start_year: 1982

returns:
  delisting_return: null             # Compustat Global has none; open decision (docs/eu_raw_data.md)
  calendar_min_lines: 100            # pooled trading day: >= this many traded closes in the pool
  holiday_fill_max_gap: 3            # stage 2b (scripts/fill_europe_holidays.py): a member's gap of <= 3 pooled
                                     # days with returns on both sides gets a zero local return, traded False

risk_free:
  # 1-month interbank rates from the Bundesbank, daily, act/360: Frankfurt banks' 1-month
  # funds to 1990-06, FIBOR to 1998-12, EURIBOR from 1999. A Mark rate before 1999, not an
  # ECU rate: no daily ECU money-market series is on WRDS or the Bundesbank API (open item).
  # Day t earns the previous trading day's quote over the calendar days in between.
  external_dir: data/eu/private/raw/external
  day_count: 360

pool: universe                       # characteristics for every company ever in the as-of top-N

fundamentals:                        # as configs/us_data.yaml
  availability: june
  lag_months: 6
  max_age_months: 30
  fill_zero: [txditc, txdb, pstk, mib, ivao, xrd, xad, txp, dlc]

windows:                             # as configs/us_data.yaml
  momentum_min_obs: {r12_2: 8, r12_7: 4, r36_13: 16}
  variance_months: 2
  variance_min_obs: 20
  spread_min_obs: 10
  suv_estimation_months: 6
  suv_min_obs: 60
  beta_vol_days: 252
  beta_vol_min_obs: 120
  beta_corr_days: 1260
  beta_corr_min_obs: 750
  rel2high_days: 252
  rel2high_min_obs: 120
  weekly_days: 5

factors:
  # Beta's market and Resid_Var's three factors (factors_daily): Ken French's Europe three
  # factors (value-weighted, all sizes, 16 countries: these less Luxembourg; from 1990-07-02).
  # Every column of FF's file is in USD: the market's USD total return (Mkt-RF + RF, RF from
  # FF's monthly T-bill because the daily file rounds it to 0.01%) is converted to the
  # numeraire, minus the numeraire rf; SMB and HML are USD long-short returns, times the day's
  # change of the numeraire per USD (the same on both legs). Before 1990-07-02, which Beta's
  # five-year window needs, the top N's own: its value-weighted market and a 2x3 sort on cap
  # (median) and BEME (30/70), value-weighted, formed at the end of M-1 (fewer than
  # min_per_portfolio in a portfolio: that month's SMB/HML are NaN). source top_n = the own
  # ones throughout.
  source: ff_europe
  file: data/europe/private/raw/external/Europe_3_Factors_Daily_CSV.zip
  tbill_monthly: data/eu/private/raw/ff_monthly.parquet
  min_per_portfolio: 5

normalisation:                       # as configs/us_data.yaml
  method: rank_quantile
  missing: last_observed
  carry_max: {daily: 5, monthly: 12}
  median_over: universe

characteristics:                     # the 39 of the US build; Spread is the Corwin-Schultz
  past_returns: [r2_1, r12_2, r12_7, r36_13, ST_Rev, Ret_D1, Ret_W1, STD_W1]   # high-low estimator here
  value: [A2ME, BEME, C, CF, CF2P, Q, Lev, E2P]
  investment: [Investment, NOA, DPI2A]
  trading_frictions: [AT, LME, LTurnover, Rel2High, Resid_Var, Spread, SUV, Variance, Vol, Beta]
  profitability: [PROF, CTO, FC2Y, OP, PM, RNA, D2A]
  intangibles: [OA, OL, PCM]

output:
  dir: data/europe17/shared          # returns / universe / features / market / rf / fx: downstream
  inspect_dir: data/europe17/private # cap table, ranking, lines, JKP table, characteristics, reports
  holfill_dir: data/europe17/holfill   # stage 2b: the schema tables with holidays filled (headline runs)
