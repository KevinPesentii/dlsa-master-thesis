  sobol-067: {objective.lambda_var: 9.85, policy.input_scale: 4.5, model.score_std_target: 0.357, model.lambda_ridge: 8.16e-05, training.batch_days: 125, policy.input: raw, policy.input_normalise: none, model.level_hidden: 0}   # 7.25
  sobol-009: {objective.lambda_var: 4.8, policy.input_scale: 0.313, model.score_std_target: null, model.lambda_ridge: 0.000819, training.batch_days: 63, policy.input: cumulative, policy.input_normalise: window_vol, model.level_hidden: 0}   # 7.20
  sobol-073: {objective.lambda_var: 5.07, policy.input_scale: 7.87, model.score_std_target: 0.863, model.lambda_ridge: 0.00024, training.batch_days: 250, policy.input: cumulative, policy.input_normalise: none, model.level_hidden: 0}   # 7.17
