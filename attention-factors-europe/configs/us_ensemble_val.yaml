# Seed ensemble against config ensemble, K = 30, on the first training window (2026-11-02), OUTSIDE the
# thesis rows; the headline's rolling residual window. scripts/ensemble_validation.py fits every candidate
# below with every seed as a search trial (fit 1990-1995, booked on 1996-1997) and averages the books:
#   seeds  = the winner (first candidate) on seeds 0-4, one book;
#   configs = the five candidates on one seed, one book per seed, the rule's score = the mean over seeds.
# Decision, fixed before any of these trials ran: the rule with the higher validation net Sharpe of the
# `book` below wins. The candidates are the five best finalists of configs/us_search.yaml
# (runs/20261010T110947Z_search_K30_val1996-1997):
# mean validation net Sharpe over seeds 0-2 after each name, best first; the base config left out.
#   python scripts/ensemble_validation.py --config configs/us_ensemble_val.yaml --jobs 25 --threads 2

base_config: configs/us_replication.yaml
fixed: {}
K: 30
first_oos_year: 1998
validation_years: 2
seeds: [0, 1, 2, 3, 4]
book: avg_l1                     # the average rescaled to ||w||_1 = 1 every day, the single runs' exposure

candidates:
