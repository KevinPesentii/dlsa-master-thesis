# Europe with the US-validated config, as CLAUDE.md prescribes: configs/europe_replication.yaml
# with the values the US search selected on 1990-1995 / 1996-1997 (search run
# 20260926T104159Z_search_K30, candidate sobol-035; US out-of-sample 1998-2021, five seeds:
# net SR 1.70). Nothing here was chosen on European data.
#   python scripts/run_attention_us.py --config configs/europe_us_validated.yaml

market: europe17
seed: 0

data:
  dir: data/europe17/shared      # the three tables of docs/schemas.md; --data-dir overrides

sample:
  start: 1998-01-01              # first out-of-sample day; training reaches back window_years
  end: 2021-12-31
  data_start: 1993-01-01         # no training date before this: before 1993 the panel has no volume
                                 # (to 1992) or high/low (to 1993), and 10 of 39 characteristics at 90%
                                 # coverage (data/europe/availability_report.md). The 1998 window is
                                 # 1993-1997, reaching the full window_years with 2001
  universe_size: 200

features:
  n_characteristics: 39          # see CONFIRM 2 in docs/schemas.md
  normalisation: rank_quantile   # see CONFIRM 1 in docs/schemas.md
  include_cross_sectional_median: true
  include_risk_free: true

model:
  kind: attention
  n_factors: 30                  # K
  embedding_dim: 32
  level_hidden: 0                # >0 conditions the queries on the date's characteristic levels
                                 # (medians + rf), which the row-wise softmax otherwise drops.
                                 # NOT in the paper: 0 reproduces Equation (1)
  score_std_target: null         # initial cross-sectional spread of the attention scores;
                                 # a scalar temperature, equivalent to rescaling Q (not in the paper)
  lambda_ridge: 1.16e-05         # ridge in the loading solve, Section 3.2

policy:
  kind: longconv
  layers: 1
  hidden: 32
  residual_lookback: 30
  dropout: 0.1
  lambda_squash: 0.001
  input: cumulative              # cumulative residual path, as in the two-step benchmark
  input_normalise: none          # none | window_vol: divide each window by its own residual
                                 # volatility. NOT in the paper; makes the input scale-free
  input_scale: 0.878             # residuals as decimal returns, LongConv(eps) as written in the paper.
                                 # NOT a harmless unit: the encoder bias, GELU and the GLU gate make the
                                 # policy depend on it; x100 traded 47% more (1998-2021, see the commit)

objective:
  lambda_var: 9.11
  turnover_cost: 0.0005          # ||w_t - w_{t-1}||_1
  short_cost: 0.0001             # ||max(-w_t, 0)||_1
  subtract_rf: true              # paper: (Rbar_net - R_f) / sd in the objective

training:
  window_years: 8
  refit: annual                  # NOT the 125/1000-day schedule of GPZ
  epochs: 30
  lr: 0.003
  weight_decay: 0.05
  batch_days: 63                 # contiguous blocks, each with residual_lookback extra dates in front
  grad_clip: 1.0

evaluation:
  report_break_even_cost: true
  cost_grid_bps: [0, 1, 2, 5, 10, 20, 30, 50]
  reference_net_sharpe: 2.28     # the paper's number, for comparison only
  save_weights: true
