# configs/us_search_ou.yaml on EUROPEAN data (decided 2026-10-12): the PCA + OU thresholds
# selected on 1996-1997, Europe's validation years, over the same grid; at K=30, used for
# every K. Deterministic: one seed. The US winner (grid-000) is a finalist either way.
#   python scripts/search_validation.py --config configs/europe_search_ou.yaml --stage select

runner: pca
base_config: configs/europe_pca_ou.yaml
K: 30
first_oos_year: 1998
validation_years: 2

search:
  seed: 0
  grid:
    policy.c_thresh: [1.0, 1.25, 1.5]
    policy.c_crit: [0.25, 0.5, 0.75]

finalists:
  top: 3
  seeds: [0]
  keep: [grid-000]            # the US OU search's winner
