# Parametric benchmark (Table 2, "PCA + OU Thresh") on the headline European data: the stage
# one of configs/europe_pca_longconv.yaml traded with the rule of configs/us_pca_ou.yaml.
#   python scripts/run_pca_longconv.py --config configs/europe_pca_ou.yaml [--K 30]

market: europe17
seed: 0                          # recorded only: the rule is deterministic

data:
  dir: data/europe17/holfill
  rf_file: data/europe17/shared/rf_daily.parquet

sample:
  start: 1998-01-01
  end: 2021-12-31

factors:
  kind: pca
  n_factors: [1, 3, 5, 8, 10, 15, 30, 100]
  cov_window: 252
  loading_window: 252            # read back from the stage-one meta.json at run time
  out_dir: data/europe17/holfill/pca_l252

policy:
  kind: ou_threshold
  residual_lookback: 30
  input: cumulative
  input_scale: 1.0
  c_thresh: 1.25
  c_crit: 0.25

objective:                       # evaluation only
  turnover_cost: 0.0005
  short_cost: 0.0001

execution:
  lag: 0
  stale_when_closed: true

evaluation:
  save_weights: true
  cost_grid_bps: [0, 1, 2, 5, 10, 20, 30, 50]
