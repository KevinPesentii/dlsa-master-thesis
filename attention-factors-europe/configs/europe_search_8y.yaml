# Europe hyperparameter search on a full-length first window: 8 years from sample.data_start,
# fit 1993-1998, score the net Sharpe on 1999-2000, nothing after 2000 loaded. Out of sample
# from 2001. The 1993-1997 window of configs/europe_search.yaml had 3 fit years and validated on
# the 1990s regime of daily residual momentum; this one has the paper's 6 + 2.
# Space, budget and rule of configs/europe_search.yaml (8 knobs, 128 points, sobol_seed 0), so the
# points are the same: sobol-009 is the US pick (Kevin, 2026-10-06), and its rank here is direct.
# Data: the holiday-filled europe17 experiment copy with returns.traded, as in
# configs/europe_search_windowvol.yaml (before 2010 the official build has no row on a line's own
# holiday, which leaves whole countries untradable inside the validation years).
# Not the headline: Europe's main result uses the US-validated config (CLAUDE.md).
# Commit before the search runs; do not edit afterwards.
#   python scripts/search_validation.py --config configs/europe_search_8y.yaml --stage select

base_config: configs/europe_replication.yaml
K: 30
first_oos_year: 2001          # first training window = [sample.data_start, first_oos_year): 1993-2000
validation_years: 2           # its last two years: 1999-2000
eval_epochs: [10, 20, 30]

# Held fixed for every candidate (applied to the base config before the search).
fixed:
  data.dir: data/europe17/private/exp_holfill_traded
  execution.lag: 0
  execution.stale_when_closed: true

search:
  n_points: 128
  sobol_seed: 0
  seed: 0
  space:
    objective.lambda_var: {log: [0.1, 300]}
    policy.input_scale: {log: [0.3, 300]}
    model.score_std_target: {log: [0.3, 3], "off": 0.25}
    model.lambda_ridge: {log: [1.0e-5, 1.0e-2]}
    training.batch_days: {choice: [63, 125, 250]}
    policy.input: {choice: [cumulative, raw]}
    policy.input_normalise: {choice: [none, window_vol]}
    model.level_hidden: {choice: [0, 8, 32]}

finalists:
  top: 5
  seeds: [0, 1, 2]

robustness:                   # not run (--stage select); kept so the file is complete
  seeds: [0, 1, 2]
  knobs:
    training.lr: [0.001, 0.01]
    policy.hidden: [16, 64]
